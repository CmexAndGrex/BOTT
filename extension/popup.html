<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 340px;
        font: 13px/1.55 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
        background: #0a0c13;
        color: #eef1f7;
        padding: 16px;
      }
      h1 { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
      .logo {
        width: 26px; height: 26px; border-radius: 50%; flex: none;
        object-fit: cover;
        box-shadow: 0 0 12px rgba(255, 61, 61, 0.4);
      }
      .row {
        display: flex; justify-content: space-between; gap: 10px;
        padding: 7px 0; border-top: 1px solid rgba(255,255,255,.06);
        font-size: 11.5px;
      }
      .row:first-of-type { border-top: none; }
      .row span { color: #7d8699; flex: none; }
      .row b {
        font-weight: 600; color: #eef1f7; text-align: right;
        overflow-wrap: anywhere; font-family: ui-monospace, Menlo, monospace;
        font-size: 10.5px;
      }
      button {
        width: 100%; margin-top: 12px; padding: 10px 12px; border-radius: 10px;
        border: 1px solid rgba(255, 150, 150, 0.4);
        background: linear-gradient(135deg, #ff5148, #c81e1e);
        color: #fff; font-weight: 700; font-size: 12.5px; cursor: pointer;
        transition: filter 0.2s;
      }
      button:hover { filter: brightness(1.1); }
      button:disabled { opacity: 0.55; cursor: wait; }
      .st { margin-top: 12px; padding: 9px 11px; border-radius: 9px; font-size: 11.5px; line-height: 1.5; }
      .st.ok { background: rgba(61, 220, 132, 0.1); color: #7fe6ae; }
      .st.err { background: rgba(255, 61, 61, 0.1); color: #ff9c9c; }
      .st.muted { background: rgba(255, 255, 255, 0.05); color: #99a1b5; }
      .hint { margin-top: 10px; font-size: 10px; color: #5d657a; line-height: 1.55; }
    </style>
  </head>
  <body>
    <!-- Логотип и новое название -->
    <h1><img src="icon.png" class="logo" alt="АТК"> RED ATK · Cookie Sync</h1>

    <div class="row"><span>Сервер</span><b id="server">…</b></div>
    <div class="row"><span>Ключ</span><b id="key">…</b></div>
    <div class="row"><span>Доступ к панели</span><b id="permission">…</b></div>
    <div class="row"><span>Cookie rs-red.com</span><b id="count">0</b></div>

    <button id="push">Отправить сейчас</button>

    <div id="status" class="st muted">Загрузка…</div>

    <div class="hint">
      Адрес сервера и ключ уже вшиты в этот архив панелью — вводить ничего не нужно.
      Расширение отправляет cookie при каждом изменении и раз в 10 минут. 
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
