services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в файле .env}"
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: migrator
    # Лёгкий образ: node_modules без dev-пакетов, без сборки Next (~300 МБ вместо ~1.2 ГБ)
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/app_db"
      # Нужен для fail-fast в seed-admin: в production админ не создаётся
      # с паролем по умолчанию, если ADMIN_PASSWORD не задан.
      NODE_ENV: "production"
      # Первый администратор. Пароль задайте в .env — он используется ТОЛЬКО
      # при создании аккаунта: существующий админ не перезаписывается.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # Осознанный сброс пароля существующего админа: ADMIN_PASSWORD_RESET=true
      ADMIN_PASSWORD_RESET: "${ADMIN_PASSWORD_RESET:-false}"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: always
    # .env подключается целиком: так в контейнер попадают переменные, которые
    # блок environment раньше не пробрасывал — в первую очередь
    # DISCORD_CLIENT_ID/SECRET. Без них /api/auth/discord отвечает 503, и кнопка
    # «Войти через Discord» на странице входа остаётся неактивной.
    # Значения из блока environment ниже приоритетнее env_file, поэтому
    # DATABASE_URL остаётся внутренним (@db:5432), а не из .env (там 127.0.0.1).
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/app_db"
      # Дублируем явно: смысл проброса виден прямо здесь, и вход через Discord
      # не сломается, если имена переменных в .env когда-нибудь переименуют.
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      RS_RED_COOKIE: "${RS_RED_COOKIE:-}"
      CRON_SECRET: "${CRON_SECRET:?Укажите CRON_SECRET в файле .env}"
      JWT_SECRET: "${JWT_SECRET:?Укажите JWT_SECRET в файле .env}"
      TZ: "${TZ:-Europe/Moscow}"
      # Резервные копии: путь внутри контейнера совпадает с точкой монтирования
      # тома ниже. Значения из .env здесь перекрываются намеренно — если в .env
      # остался локальный ./backups, дампы ушли бы внутрь контейнера и пропали
      # при его пересоздании.
      BACKUP_DIR: "/app/backups"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
    volumes:
      # Копии базы: том, а не bind-mount, чтобы права nextjs сохранялись и на
      # хосте не требовалось создавать каталог вручную.
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Вариант без домена: приложение сразу доступно как http://IP-СЕРВЕРА:3000
      - "3000:3000"
      # Если перед ним ставите Caddy/nginx — безопаснее слушать только локально:
      # - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  # Резервные копии: живут вне контейнера, поэтому переживают пересборку образа
  # и удаление контейнера. Каталог /app/backups создан в образе (см. Dockerfile),
  # иначе Docker отдал бы точку монтирования root, и nextjs не смог бы писать
  # дампы.
  backups: