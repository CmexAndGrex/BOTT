name: CI

# Проверки запускаются на каждый push и pull request в main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем устаревшие прогоны той же ветки, чтобы не тратить минуты впустую
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Минимально необходимые права: только чтение репозитория
permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история: gitleaks проверяет не только рабочее дерево, но и
          # коммиты — секрет мог быть удалён из файла, но остаться в истории.
          fetch-depth: 0

      # 1. Собственный сканер проекта: работает из репозитория, без установки и
      #    сети, ловит форматы секретов, встречающиеся именно здесь (паспорт
      #    Google, токен Discord-бота, cookie rs-red, ключ синхронизации).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Project secret scan
        run: node scripts/secret-scan.mjs

      # 2. Внешний детектор: дополнительная проверка истории общим списком
      #    правил (шире, чем встроенный сканер).
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: test / typecheck / lint / build
    runs-on: ubuntu-latest
    # Сборка не начинается, пока не подтверждено, что секреты не утекли
    needs: secret-scan

    env:
      # next build выполняет модули с проверками на этапе загрузки, поэтому
      # переменные нужны уже во время сборки (аналогично Dockerfile):
      #   - DATABASE_URL: src/db/index.ts падает без него;
      #   - JWT_SECRET (>= 32 символов): src/lib/auth.ts в production падает,
      #     если секрет не задан или равен известной заглушке.
      # Здесь только публичные заглушки для сборки. Настоящие секреты
      # передаются приложению в рантайме (docker-compose), не в CI.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      JWT_SECRET: ci-build-placeholder-secret-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Тесты используют нативное выполнение TypeScript, поэтому нужен Node 24+.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build